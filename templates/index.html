<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🏠 House Price Prediction</h1>

    <form action="/predict" method="post">

        <input type="number"
               name="sqft_living"
               placeholder="Living Area (sqft)"
               required>

        <input type="number"
               name="bedrooms"
               placeholder="Bedrooms"
               required>

        <input type="number"
               step="0.5"
               name="bathrooms"
               placeholder="Bathrooms"
               required>

        <input type="number"
               step="0.5"
               name="floors"
               placeholder="Floors"
               required>

        <button type="submit">
            Predict Price
        </button>

    </form>

    <div class="result">
        {{ prediction_text }}
    </div>

</div>

</body>
</html>
